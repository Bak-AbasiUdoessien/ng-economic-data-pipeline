# Run the pipeline against a local PostgreSQL database:
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl            # fine for a local demo - never commit real passwords
      POSTGRES_DB: economy
    ports: ["5432:5432"]                # so you can connect from VS Code / DBeaver on localhost
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etl"]
      interval: 5s
      retries: 10
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://etl:etl@db:5432/economy   # "db" = the service name above
    depends_on:
      db:
        condition: service_healthy      # wait until Postgres is ready
